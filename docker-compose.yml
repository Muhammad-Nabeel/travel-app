version: "3.9"
services:
  travel-app-main:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: npm run dev
